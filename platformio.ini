; Monster Soundboard firmware for the Spotpear ESP32-S3 "AI 1.54" (muma) board
; ESP32-S3R8 + 16 MB flash, ST7789 240x240, ES8311 codec + NS4150B amp, SD slot.

[platformio]
default_envs = monster

[env:monster]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board     = esp32-s3-devkitc-1
framework = arduino

; ---- memory: N16R8 = 16 MB quad flash + 8 MB octal PSRAM ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv
board_build.f_cpu               = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; USB-Serial/JTAG (flash + log over the board's USB-C)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB, keeps UART0 (GPIO43/44) free for keys
    -DCORE_DEBUG_LEVEL=1

extra_scripts = pre:tools/build_web.py

lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.33

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600
